name: "Reusable: linuxptp-daemon golangci-lint"
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Run GolangCI-Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/linuxptp-daemon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: lint test
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: "goinstall"
          args: --timeout 5m
          only-new-issues: true
          working-directory: pkg/linuxptp-daemon
