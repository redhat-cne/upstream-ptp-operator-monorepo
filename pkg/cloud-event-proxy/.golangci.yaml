run:
  timeout: 5m

output:
  formats:
    - format: colored-line-number

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - revive
      text: dot-imports
    - path: examples/
      linters:
        - revive
      text: unused-parameter
